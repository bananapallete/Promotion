# Render Blueprint: 저장소를 연결하고 "New + > Blueprint"로 열면 서비스가 만들어진다. HOST_KEY(진행자 키)는 대시보드에서 직접 입력한다.
services:
  - type: web
    name: quiz-game
    runtime: node
    rootDir: quiz-game
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: HOST_KEY
        sync: false
      - key: PUBLIC_URL
        sync: false
