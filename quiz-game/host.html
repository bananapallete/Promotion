<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>퀴즈 게임 · 호스트</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="host">
    <div id="auth" class="panel" hidden>
      <h1>호스트</h1>
      <input id="key" type="text" placeholder="키" />
      <button id="login" class="primary" style="margin-top:12px">입장</button>
      <p id="aerr" style="color:var(--bad)"></p>
    </div>
    <div id="app" class="hostgrid" hidden>
      <div class="card">
        <h2>진행</h2>
        <div class="stat"><span id="s-phase">-</span><span id="s-left">-</span><span id="s-players">-</span></div>
        <div class="row-inline" style="margin-top:12px">
          <button class="go" id="end">정답</button>
          <button id="gather">모이기</button>
          <button id="coin">동전</button>
          <button id="rank">순위</button>
          <button class="warn" id="reset">초기화</button>
        </div>
        <div id="revealbox" style="margin-top:10px;color:var(--mute);font-size:14px"></div>
      </div>

      <div class="card">
        <h2>문제</h2>
        <div id="qlist"></div>
        <h2 style="margin-top:16px">추가</h2>
        <div class="row-inline">
          <select id="q-type"><option value="ox">O/X</option><option value="choice">객관식</option></select>
          <input id="q-ans" type="text" placeholder="정답" size="14" />
          <input id="q-time" type="number" value="15" min="5" max="60" style="width:70px" />초
        </div>
        <div class="row-inline"><input id="q-text" type="text" placeholder="문제" style="flex:1" /><button class="go" id="q-add">추가</button></div>
      </div>

      <div class="card">
        <h2>봇</h2>
        <div class="row-inline">
          <select id="b-mode">
            <option value="idle">정지</option>
            <option value="wander">배회</option>
            <option value="aggro">공격형</option>
          </select>
          <select id="b-char"></select>
          <input id="b-count" type="number" value="1" min="1" max="10" style="width:64px" />
          <button class="go" id="b-add">추가</button>
          <button class="warn" id="b-clear">제거</button>
        </div>
        <label class="row-inline" style="margin-top:8px"><input type="checkbox" id="b-attack" /> 공격 허용</label>
      </div>

      <div class="card">
        <h2>참가자</h2>
        <table><thead><tr><th>이름</th><th>캐릭터</th><th>체력</th><th>점수</th><th></th></tr></thead><tbody id="plist"></tbody></table>
      </div>
    </div>
    <script type="module" src="/src/host.js"></script>
  </body>
</html>
