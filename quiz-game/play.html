<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>퀴즈 게임 · 참가</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="play">
    <div id="join-ui" class="panel" hidden>
      <h1>입장</h1>
      <input id="name" type="text" maxlength="10" placeholder="닉네임" autocomplete="off" />
      <div id="chars"></div>
      <button id="go" class="primary">입장</button>
      <p id="err" style="color:var(--bad)"></p>
    </div>

    <div id="game-ui" hidden>
      <div id="hudbar">
        <div class="row"><span id="me">-</span><span id="score">0점</span></div>
        <div class="bar" title="체력"><i id="hp"></i></div>
        <div class="bar run" title="달리기"><i id="rg"></i></div>
        <div id="phase"></div>
      </div>
      <button id="menu">변경</button>
      <div id="flag"></div>
      <div id="result"></div>
      <div id="lzone"></div>
      <div id="padHint">조이스틱</div>
      <div id="pad"><div id="stick"></div></div>
      <button id="btnRun" class="abtn">달리기</button>
      <button id="btnUlt" class="abtn" type="button">궁극기</button>
      <button id="btnAtk" class="abtn">공격<span id="aim"></span></button>
      <div id="ammo" hidden></div>
    </div>
    <script type="module" src="/src/play.js"></script>
  </body>
</html>
