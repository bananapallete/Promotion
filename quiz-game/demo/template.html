<title>파란티 전투 데모</title>
<style>
  /* 한 가지 세계관(어두운 게임 화면)으로 고정한 단일 테마 */
  :root {
    --bg: #1d2433; --panel: #28324a; --panel-2: #151b29; --ink: #eef2f7; --mute: #9fb0c7;
    --accent: #4cc2ff; --ok: #2ecc71; --bad: #ff6b6b; --warn: #ffd54a;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button, select { font: inherit; }

  #stage { position: absolute; inset: 0; }
  #game, #game canvas { width: 100% !important; height: 100% !important; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #top { position: absolute; left: 0; right: 0; top: max(8px, env(safe-area-inset-top, 0px)); padding: 0 calc(max(16px, env(safe-area-inset-right, 0px)) + 52px) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }

  #me { flex: 1 1 150px; max-width: 220px; background: rgba(21,27,41,.82); border-radius: 12px; padding: 8px 10px; display: grid; gap: 5px; font-size: 12px; font-weight: 700; }
  #me .row { display: flex; justify-content: space-between; }
  .bar { height: 7px; background: #0007; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .1s; }
  .bar.run > i { background: var(--accent); }
  #flag { min-height: 14px; color: var(--warn); font-size: 12px; }

  #banner { flex: 1 1 200px; background: rgba(29,36,51,.8); border-radius: 12px; padding: 6px 14px; text-align: center; }
  #banner[hidden] { display: none; }
  #qn { color: var(--accent); font-weight: 700; font-size: 11px; }
  #qt { font-size: clamp(15px, 4vw, 22px); font-weight: 800; }
  #phase { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(max(22px, env(safe-area-inset-bottom, 0px)) + 236px); background: rgba(21,27,41,.8); padding: 3px 12px; border-radius: 99px; font-size: 12px; color: var(--mute); white-space: nowrap; }
  #reveal { flex: 1 1 100%; text-align: center; padding: 6px 16px; border-radius: 10px; font-weight: 800; font-size: clamp(14px, 4vw, 20px); }
  #reveal.ok { background: var(--ok); color: #06331a; }
  #reveal.bad { background: var(--bad); color: #3b0b0b; }
  #reveal[hidden] { display: none; }

  #lzone { position: fixed; left: 0; top: 130px; bottom: 0; width: 50%; touch-action: none; z-index: 1; }
#padHint { position: fixed; left: max(92px, 25vw); bottom: 110px; width: 110px; height: 110px; transform: translate(-50%, 50%); border-radius: 50%; border: 2px dashed #ffffff40; display: grid; place-items: center; color: #ffffff70; font-size: 12px; pointer-events: none; transition: opacity .15s; }
#padHint.off { opacity: 0; }
#pad { position: fixed; left: 0; top: 0; width: 132px; height: 132px; transform: translate(-50%, -50%); border-radius: 50%; background: #ffffff18; border: 2px solid #ffffff40; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 2; }
#pad.on { opacity: 1; }
#pad::before { content: ''; position: absolute; left: 50%; top: 50%; width: 50%; height: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed #ffffff55; pointer-events: none; }
  #stick { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffffa0; }
  .abtn { position: fixed; border-radius: 50%; border: 3px solid #ffffff60; color: #fff; font-weight: 800; touch-action: none; display: grid; place-items: center; cursor: pointer; }
  #btnAtk { right: max(56px, 13vw); bottom: calc(max(28px, env(safe-area-inset-bottom, 0px)) + 36px); width: 100px; height: 100px; font-size: 20px; background: #ff6b6baa; }
  #btnRun { right: calc(max(56px, 13vw) + 14px); bottom: calc(max(28px, env(safe-area-inset-bottom, 0px)) + 36px + 112px); width: 72px; height: 72px; font-size: 15px; background: #4cc2ffaa; }
  #btnRun.on { background: var(--accent); transform: scale(.94); }
  #aim { position: absolute; left: 50%; top: 50%; width: 0; height: 6px; background: #fff; border-radius: 4px; transform-origin: 0 50%; pointer-events: none; opacity: 0; }

  #gear { position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--panel); color: var(--ink); font-size: 20px; cursor: pointer; z-index: 20; }
  #panel { position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 52px); width: min(340px, calc(100vw - 100px)); max-height: calc(100vh - 16px); overflow: auto; background: var(--panel); border-radius: 14px; padding: 12px 14px; z-index: 20; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #panel[hidden] { display: none; }
  #panel h3 { margin: 10px 0 6px; font-size: 12px; color: var(--accent); letter-spacing: .04em; }
  #panel h3:first-child { margin-top: 0; }
  .row-inline { display: flex; gap: 6px; flex-wrap: wrap; }
  #panel button, #panel select { padding: 8px 10px; border-radius: 9px; border: 0; background: #3a4766; color: var(--ink); font-size: 13px; cursor: pointer; }
  #panel button.go { background: var(--accent); color: #05293b; font-weight: 700; }
  #panel button.warn { background: #7a3340; }
  #panel button.sel { outline: 2px solid var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  #panel p { margin: 8px 0 0; color: var(--mute); font-size: 12px; line-height: 1.5; }

</style>

<div id="stage">
  <div id="game"></div>
  <div id="hud">
    <div id="top">
      <div id="me">
        <div class="row"><span>나</span><span id="score">0점</span></div>
        <div class="bar" title="체력"><i id="hp"></i></div>
        <div class="bar run" title="달리기"><i id="rg"></i></div>
        <div id="flag"></div>
      </div>
      <div id="banner" hidden><div id="qn"></div><div id="qt"></div></div>
      <div id="reveal" hidden></div>
    </div>
    <div id="phase"></div>
  </div>
</div>

<div id="lzone"></div>
<div id="padHint"></div>
<div id="pad"><div id="stick"></div></div>
<button id="btnRun" class="abtn" type="button">달리기</button>
<button id="btnAtk" class="abtn" type="button">공격<span id="aim"></span></button>

<button id="gear" type="button" aria-label="테스트 패널">⚙</button>
<div id="panel" hidden>
  <h3>문제</h3>
  <div class="row-inline">
    <button class="go" data-act="ask" data-id="1" type="button">O/X</button>
    <button class="go" data-act="ask" data-id="2" type="button">객관식</button>
    <button data-act="end" type="button">정답</button>
  </div>
  <h3>봇</h3>
  <div class="row-inline">
    <select id="b-mode"><option value="idle" selected>정지</option><option value="wander">배회</option><option value="aggro">공격형</option></select>
    <select id="b-char"></select>
    <button class="go" data-act="bot" type="button">추가</button>
    <button class="warn" data-act="clear" type="button">제거</button>
  </div>
  <p><label><input type="checkbox" id="b-attack" /> 공격 허용</label></p>
  <h3>캐릭터</h3>
  <div class="grid" id="chars"></div>
  <h3>시점</h3>
  <div class="row-inline">
    <button class="sel" data-act="view" data-v="follow" type="button">따라가기</button>
    <button data-act="view" data-v="all" type="button">전체</button>
  </div>
  <h3>동전</h3>
  <div class="row-inline">
    <button class="go" data-act="coinnear" type="button">앞에</button>
    <button data-act="coin" type="button">무작위</button>
    <button data-act="coin5" type="button">+5</button>
    <button class="warn" data-act="ko" type="button">기절</button>
  </div>
  <div class="row-inline">
    <button data-act="gather" type="button">모이기</button>
    <button class="warn" data-act="reset" type="button">초기화</button>
  </div>
</div>

<script>
/*BUNDLE*/
</script>
