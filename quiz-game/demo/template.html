<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>파란티 전투 데모</title>
<style>
  /* 한 가지 세계관(어두운 게임 화면)으로 고정한 단일 테마 */
  :root {
    --bg: #1d2433; --panel: #28324a; --panel-2: #151b29; --ink: #eef2f7; --mute: #9fb0c7;
    --accent: #4cc2ff; --ok: #2ecc71; --bad: #ff6b6b; --warn: #ffd54a;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  button, select { font: inherit; }

  #stage { position: absolute; inset: 0; }
  #charbar { position: fixed; left: 0; right: 0; top: max(8px, env(safe-area-inset-top, 0px)); padding: 0 calc(max(16px, env(safe-area-inset-right, 0px)) + 56px) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 6px; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; z-index: 15; }
  #charbar::-webkit-scrollbar { display: none; }
  #charbar button { flex: none; display: flex; align-items: center; gap: 6px; padding: 9px 13px; border: 0; border-radius: 99px; background: rgba(40,50,74,.92); color: var(--ink); font-size: 13px; white-space: nowrap; cursor: pointer; }
  #charbar button.sel { background: var(--accent); color: #05293b; font-weight: 700; }
  #charbar i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #fff8; }
  #game, #game canvas { width: 100% !important; height: 100% !important; display: block; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #top { position: absolute; left: 0; right: 0; top: calc(max(8px, env(safe-area-inset-top, 0px)) + 48px); padding: 0 calc(max(16px, env(safe-area-inset-right, 0px)) + 52px) 0 max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-start; }

  #me { flex: 1 1 150px; max-width: 220px; background: rgba(21,27,41,.82); border-radius: 12px; padding: 8px 10px; display: grid; gap: 5px; font-size: 12px; font-weight: 700; }
  #me .row { display: flex; justify-content: space-between; }
  .bar { height: 7px; background: #0007; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 100%; background: var(--ok); transition: width .1s; }
  .bar.run > i { background: var(--accent); }
  #flag { min-height: 14px; color: var(--warn); font-size: 12px; }

  #banner { flex: 1 1 200px; background: rgba(29,36,51,.8); border-radius: 12px; padding: 6px 14px; text-align: center; }
  #banner[hidden] { display: none; }
  #qn { color: var(--accent); font-weight: 700; font-size: 11px; }
  #qt { font-size: clamp(15px, 4vw, 22px); font-weight: 800; }
  #phase { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(max(22px, env(safe-area-inset-bottom, 0px)) + 236px); background: rgba(21,27,41,.8); padding: 3px 12px; border-radius: 99px; font-size: 12px; color: var(--mute); white-space: nowrap; }
  #reveal { flex: 1 1 100%; text-align: center; padding: 6px 16px; border-radius: 10px; font-weight: 800; font-size: clamp(14px, 4vw, 20px); }
  #reveal.ok { background: var(--ok); color: #06331a; }
  #reveal.bad { background: var(--bad); color: #3b0b0b; }
  #reveal[hidden] { display: none; }

  #lzone { position: fixed; left: 0; top: 190px; bottom: 0; width: 50%; touch-action: none; z-index: 1; }
#padHint { position: fixed; left: max(92px, 25vw); bottom: 110px; width: 110px; height: 110px; transform: translate(-50%, 50%); border-radius: 50%; border: 2px dashed #ffffff40; display: grid; place-items: center; color: #ffffff70; font-size: 12px; pointer-events: none; transition: opacity .15s; }
#padHint.off { opacity: 0; }
#pad { position: fixed; left: 0; top: 0; width: 132px; height: 132px; transform: translate(-50%, -50%); border-radius: 50%; background: #ffffff18; border: 2px solid #ffffff40; pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 2; }
#pad.on { opacity: 1; }
#pad::before { content: ''; position: absolute; left: 50%; top: 50%; width: 50%; height: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed #ffffff55; pointer-events: none; }
  #stick { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: #ffffffa0; }
  .abtn { position: fixed; border-radius: 50%; border: 3px solid #ffffff60; color: #fff; font-weight: 800; touch-action: none; display: grid; place-items: center; cursor: pointer; }
  #btnAtk { right: max(10px, env(safe-area-inset-right, 0px)); bottom: calc(max(28px, env(safe-area-inset-bottom, 0px)) + 36px); width: 100px; height: 100px; font-size: 20px; background: #ff6b6baa; }
  #btnRun { right: calc(max(10px, env(safe-area-inset-right, 0px)) + 14px); bottom: calc(max(28px, env(safe-area-inset-bottom, 0px)) + 36px + 112px); width: 72px; height: 72px; font-size: 15px; background: #4cc2ffaa; }
  #btnRun.on { background: var(--accent); transform: scale(.94); }
        #aim, #aimU { position: absolute; left: 50%; top: 50%; width: 0; height: 6px; background: #fff; border-radius: 4px; transform-origin: 0 50%; pointer-events: none; opacity: 0; }

  #gear { position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--panel); color: var(--ink); font-size: 20px; cursor: pointer; z-index: 20; }
  #panel { position: fixed; top: max(8px, env(safe-area-inset-top, 0px)); right: calc(max(16px, env(safe-area-inset-right, 0px)) + 52px); width: min(340px, calc(100vw - 100px)); max-height: calc(100vh - 16px); overflow: auto; background: var(--panel); border-radius: 14px; padding: 12px 14px; z-index: 20; box-shadow: 0 8px 30px rgba(0,0,0,.4); }
  #panel[hidden] { display: none; }
  #uiToggle { position: fixed; top: calc(max(8px, env(safe-area-inset-top, 0px)) + 52px); right: max(16px, env(safe-area-inset-right, 0px)); width: 44px; height: 32px; border-radius: 10px; border: 0; background: var(--panel); color: var(--ink); font-size: 13px; font-weight: 700; cursor: pointer; z-index: 20; }
  body.hideui #uiToggle { opacity: .4; }
  /* 상단에는 캐릭터 바와 설정 버튼만: 내 상태 패널은 숨기고, 문제 배너는 아래 가운데로, UI 숨김 버튼은 왼쪽 아래 모서리로 */
  #me { display: none; }
  #deathMsg { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 30; font: 900 30px/1.2 system-ui, 'Noto Sans KR', sans-serif; color: #fff; text-shadow: 0 0 4px #000, 0 2px 0 #000, 2px 0 0 #000, -2px 0 0 #000; pointer-events: none; white-space: nowrap; }
  body.dead #game canvas { filter: grayscale(1) contrast(1.05); }
  #game canvas { transition: filter .35s; }
  #top { top: auto; bottom: max(14px, env(safe-area-inset-bottom, 0px)); left: 50%; right: auto; transform: translateX(-50%); width: min(44vw, 520px); padding: 0; }
  #uiToggle { top: auto; right: auto; left: max(10px, env(safe-area-inset-left, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: 36px; height: 28px; font-size: 11px; opacity: .55; }
  /* 상단 UI 숨김: 캐릭터 바, 내 상태·문제 배너, 단계 표시, 테스트 패널. 조작 버튼과 맵은 그대로 */
  body.hideui #charbtn, body.hideui #top, body.hideui #phase, body.hideui #gear, body.hideui #panel { display: none; }
  #panel h3 { margin: 10px 0 6px; font-size: 12px; color: var(--accent); letter-spacing: .04em; }
  #panel h3:first-child { margin-top: 0; }
  .row-inline { display: flex; gap: 6px; flex-wrap: wrap; }
  #panel button, #panel select { padding: 8px 10px; border-radius: 9px; border: 0; background: #3a4766; color: var(--ink); font-size: 13px; cursor: pointer; }
  #panel button.go { background: var(--accent); color: #05293b; font-weight: 700; }
  #panel button.warn { background: #7a3340; }
  #panel button.sel { outline: 2px solid var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  #panel p { margin: 8px 0 0; color: var(--mute); font-size: 12px; line-height: 1.5; }

  /* 디자인 스타일 (DESIGN.md) */
  :root { --cream: #e8d0a9; --cream-hi: #f6e6c8; --wood: #b27c53; --wood-dk: #7a4e32; --text: #5a3a24; --leaf: #b4d36a; --leaf-dk: #6e9a3a; --rose: #b34a5c; --sky: #5aa7ff; --navy: #14122b; --empty: #7f9298; --bg: #2f4a33; --ok: var(--rose); --accent: var(--leaf-dk); }
  #me, #banner, #phase, #reveal, #gear, #panel, #uiToggle { background: var(--cream); color: var(--text); border: 3px solid var(--wood-dk); border-radius: 8px; box-shadow: 0 4px 0 var(--wood-dk), inset 0 0 0 2px var(--cream-hi); --mute: #8b6a4a; --ink: var(--text); }
  #phase { border-radius: 99px; }
  #qn { color: var(--leaf-dk); }
  #reveal.ok { background: var(--leaf); color: var(--text); } #reveal.bad { background: #e9a0ab; color: #4a1420; }
  #charbar button { background: var(--cream); color: var(--text); border: 3px solid var(--wood); border-radius: 8px; box-shadow: 0 3px 0 var(--wood-dk); }
  #charbar button.sel { background: var(--leaf); border-color: var(--leaf-dk); color: var(--text); box-shadow: 0 3px 0 #4d7226; }
  .bar { height: 12px; background: var(--empty); border: 3px solid var(--navy); border-radius: 3px; position: relative; }
  .bar > i { background: var(--rose); box-shadow: inset 0 3px 0 #e9a0ab88; }
  .bar.run > i { background: var(--sky); box-shadow: inset 0 3px 0 #ffffff55; }
  .bar::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 calc(20% - 2px), var(--navy) calc(20% - 2px) 20%); }
  .bar.run::after { display: none; }
  .abtn { border: 4px solid var(--navy); box-shadow: 0 5px 0 #0007, inset 0 0 0 3px #ffffff40; }
  #btnAtk { background: #d9606f; } #btnRun { background: #5aa7ff; }
    #stick { border: 3px solid var(--navy); background: var(--cream-hi); }
  #btnUlt { right: calc(max(10px, env(safe-area-inset-right, 0px)) + 112px); bottom: calc(max(28px, env(safe-area-inset-bottom, 0px)) + 46px); width: 76px; height: 76px; font-size: 14px; background: linear-gradient(to top, #ffd54a calc(var(--f, 0) * 100%), #6a4fb0 0); color: #fff; text-shadow: 0 0 3px var(--navy), 0 0 3px var(--navy); }
  #btnUlt.ready { animation: ultpulse .7s ease-in-out infinite alternate; }
  @keyframes ultpulse { from { box-shadow: 0 5px 0 #0007, 0 0 0 0 #ffd54a99; } to { box-shadow: 0 5px 0 #0007, 0 0 18px 6px #ffd54acc; } }
  .abtn { opacity: .7; align-content: center; gap: 2px; }
  .abtn .bico { width: 26px; height: 26px; image-rendering: pixelated; pointer-events: none; filter: drop-shadow(0 1px 0 #0006); }
  #btnUlt.ready { opacity: .95; animation: none; }
  #btnUlt.ready::after, #btnUlt.ready::before { content: ''; position: absolute; inset: -3px; border-radius: 50%; border: 3px solid #ffe27a; pointer-events: none; opacity: 0; animation: ultwave 2s ease-out infinite; } /* 2초마다 퍼지는 빛 파장 */
  #btnUlt.ready::before { animation-delay: .3s; border-color: #fff3b0; }
  @keyframes ultwave { 0% { transform: scale(1); opacity: .95; } 70% { opacity: .25; } 100% { transform: scale(2); opacity: 0; } }
  #pick { position: fixed; inset: 0; z-index: 60; background: #2f4a33; overflow-y: auto; touch-action: pan-y; }
  #pick[hidden] { display: none; }
  #nick { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; background: #14122bcc; padding: 20px; }
  #nick[hidden] { display: none; }
  #nick .mbox { width: min(340px, 100%); display: grid; gap: 12px; padding: 18px; background: #e8d0a9; border: 4px solid #b27c53; border-radius: 16px; box-shadow: 0 6px 0 #7a4e32; }
  #nickin { box-sizing: border-box; width: 100%; padding: 14px; font-size: 20px; font-weight: 800; font-family: inherit; text-align: center; color: #5a3a24; background: #f6e6c8; border: 3px solid #d9a63a; border-radius: 12px; outline: none; } /* 16px 미만이면 모바일이 입력 때 확대해서 안 돌아옴 */
  #nickin::placeholder { color: #b9a37a; }
  #nickin.bad { border-color: #e5483c; animation: nameshake .3s; }
  @keyframes nameshake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #nickgo { padding: 14px; font-size: 20px; font-weight: 900; font-family: inherit; color: #3d5a1a; background: #b4d36a; border: 3px solid #14122b; border-radius: 12px; box-shadow: 0 4px 0 #4d7226; cursor: pointer; }
  #nickgo:active { transform: translateY(3px); box-shadow: 0 1px 0 #4d7226; }
  #pick .box { max-width: 760px; margin: 0 auto; padding: 16px 16px 90px; }
  #pickgo { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(16px, env(safe-area-inset-bottom, 0px)); padding: 14px 56px; border: 3px solid var(--leaf-dk); border-radius: 8px; background: var(--leaf); color: var(--text); font-size: 18px; font-weight: 800; box-shadow: 0 4px 0 #4d7226; cursor: pointer; }
  #pickgo:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #4d7226; }
  #charbtn { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: max(8px, env(safe-area-inset-top, 0px)); z-index: 20; padding: 11px 16px; border: 3px solid var(--wood); border-radius: 8px; background: var(--cream); color: var(--text); font: 700 14px system-ui, 'Noto Sans KR', sans-serif; box-shadow: 0 3px 0 var(--wood-dk); cursor: pointer; }
  #charbtn:active { transform: translateY(3px); box-shadow: none; }
  .abtn { border: 0 !important; box-shadow: 0 4px 10px #0005 !important; } /* 버튼 테두리 없음 */
  #toprank { position: fixed; left: max(10px, env(safe-area-inset-left, 0px)); top: 58px; z-index: 15; display: grid; gap: 3px; pointer-events: none; }
  #toprank div { display: grid; grid-template-columns: 16px minmax(0, 8em) auto; gap: 6px; align-items: baseline; padding: 3px 9px; font-size: 12px; font-weight: 800; color: #5a3a24; background: #f6e6c8cc; border-radius: 99px; }
  #toprank div:first-child b { color: #d98a00; }
  #toprank div.me { background: #b4d36acc; }
  #toprank span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #toprank i { font-style: normal; font-variant-numeric: tabular-nums; }
  #ultframe { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 25; pointer-events: none; image-rendering: pixelated; opacity: 0; }
  #top, #banner, #reveal, #phase { display: none !important; } /* 상단 UI(quizTop)로 대체 */
  #charbtn { top: auto !important; bottom: 62px; } /* 상단은 퀴즈 UI 자리 */
  /* 버튼 배치 통일: 공격(104) 기준, 간격 12px. 궁극기는 공격 왼쪽, 달리기는 공격 위(가운데 맞춤). 글자 14px, 아이콘·글자 간격 같게 */
  :root { --bR: max(10px, env(safe-area-inset-right, 0px)); --bB: max(24px, env(safe-area-inset-bottom, 0px)); --bg: 12px; }
  #btnAtk { width: 104px; height: 104px; right: var(--bR); bottom: var(--bB); }
  #btnUlt { width: 80px; height: 80px; right: calc(var(--bR) + 104px + var(--bg)); bottom: var(--bB); }
  #btnRun { width: 72px; height: 72px; right: calc(var(--bR) + 16px); bottom: calc(var(--bB) + 104px + var(--bg)); }
  .abtn { padding: 0; font-size: 14px; line-height: 1; gap: 4px; }
  #btnAtk { font-size: 16px; }
</style>

<div id="deathMsg" hidden></div>
<div id="nick" hidden><div class="mbox"><input id="nickin" type="text" maxlength="10" placeholder="닉네임" autocomplete="off" enterkeyhint="done"><button id="nickgo" type="button">확인</button></div></div>
<div id="pick"><div class="box"><div id="pickroot"></div><button id="pickgo" type="button">시작</button></div></div>
<button id="charbtn" type="button">캐릭터 변경</button>
<div id="stage">
  <div id="game"></div>
  <div id="hud">
    <div id="top">
      <div id="me">
        <div class="row"><span>나</span><span id="score">0점</span></div>
        <div class="bar" title="체력"><i id="hp"></i></div>
        <div class="bar run" title="달리기"><i id="rg"></i></div>
        <div id="flag"></div>
      </div>
      <div id="banner" hidden><div id="qn"></div><div id="qt"></div></div>
      <div id="reveal" hidden></div>
    </div>
    <div id="phase"></div>
  </div>
</div>

<div id="lzone"></div>
<div id="padHint"></div>
<div id="pad"><div id="stick"></div></div>
<button id="btnRun" class="abtn" type="button">달리기</button>
<button id="btnUlt" class="abtn" type="button">궁극기<span id="aimU"></span></button>
<button id="btnAtk" class="abtn" type="button">공격<span id="aim"></span></button>

<button id="gear" type="button" aria-label="테스트 패널">⚙</button>
<button id="uiToggle" type="button" aria-label="상단 UI 숨기기">UI</button>
<div id="panel" hidden>
  <h3>문제</h3>
  <div class="row-inline">
    <button class="go" data-act="ask" data-id="1" type="button">O/X</button>
    <button class="go" data-act="ask" data-id="2" type="button">객관식</button>
    <button data-act="end" type="button">정답</button>
  </div>
  <h3>봇</h3>
  <div class="row-inline">
    <select id="b-mode"><option value="idle">정지</option><option value="wander">배회</option><option value="aggro" selected>공격형</option></select>
    <select id="b-char"></select>
    <button class="go" data-act="bot" type="button">추가</button>
    <button class="warn" data-act="clear" type="button">제거</button>
    <button data-act="abots" type="button">공격봇 15</button>
  </div>
  <h3>궁극기</h3>
  <div class="row-inline">
    <button class="go" data-act="ultfull" type="button">충전</button>
  </div>
  <p><label><input type="checkbox" id="b-attack" /> 공격 허용</label></p>
  <h3>시점</h3>
  <div class="row-inline">
    <button class="sel" data-act="view" data-v="follow" type="button">따라가기</button>
    <button data-act="view" data-v="all" type="button">전체</button>
  </div>
  <h3>동전</h3>
  <div class="row-inline">
    <button class="go" data-act="coinnear" type="button">앞에</button>
    <button data-act="coin" type="button">무작위</button>
    <button data-act="coin5" type="button">+5</button>
    <button class="warn" data-act="ko" type="button">기절</button>
  </div>
  <div class="row-inline">
    <button data-act="gather" type="button">모이기</button>
    <button class="warn" data-act="reset" type="button">초기화</button>
  </div>
</div>

<script>
/*BUNDLE*/
</script>
